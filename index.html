<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Expense Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <h1>Student Expense Tracker</h1>
    <form id="expenseForm">
      <label for="expenseName">Expense Name</label>
      <input type="text" id="expenseName" required>
      <label for="expenseAmount">Amount</label>
      <input type="number" id="expenseAmount" min="1" step="1" required>
      <label for="category">Category</label>
      <select id="category" required>
        <option value="Food">Food</option>
        <option value="Travel">Travel</option>
        <option value="Shopping">Shopping</option>
        <option value="Education">Education</option>
        <option value="Other">Other</option>
      </select>
      <button type="submit">Add Expense</button>
    </form>
    <label for="categoryFilter">Filter by Category</label>
    <select id="categoryFilter">
      <option value="All">All Categories</option>
      <option value="Food">Food</option>
      <option value="Travel">Travel</option>
      <option value="Shopping">Shopping</option>
      <option value="Education">Education</option>
      <option value="Other">Other</option>
    </select>
    <h2>Total Expenses: <span id="total">0</span></h2>
    <section class="expenses">
      <h2>Your Expenses</h2>
      <p id="emptyMessage">No expenses added yet.</p>
      <p id="errorMessage" aria-live="polite"></p>
      <ul id="expenseList"></ul>
    </section>
  </div>
  <script src="server.js"></script>
</body>
</html>
